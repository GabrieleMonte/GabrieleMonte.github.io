name: Build Strava Monthly Snapshots

on:
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Re-fetch the whole history from 2024-12-07 instead of the rolling window"
        type: boolean
        default: false
      force_prune:
        description: "Allow removing many stored activities at once (only if they really were deleted on Strava)"
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * *"   # daily at 04:17 UTC (GitHub often runs this late; the rolling window makes that harmless)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build snapshots
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          FULL_REFRESH: ${{ inputs.full_refresh && '1' || '0' }}
          FORCE_PRUNE: ${{ inputs.force_prune && '1' || '0' }}
        run: node scripts/fetch_strava.js

      - name: Commit & push snapshots
        run: |
          git config user.name "gh-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/activities
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Strava snapshots [skip ci]"
            git push
          else
            echo "No changes."
          fi
